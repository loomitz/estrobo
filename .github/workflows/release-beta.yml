name: Release public beta

on:
  push:
    tags:
      - "v*-beta.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate beta tag
    runs-on: macos-15
    timeout-minutes: 10
    outputs:
      version: ${{ steps.release.outputs.version }}
      build_number: ${{ steps.release.outputs.build_number }}
      commit: ${{ steps.release.outputs.commit }}
      release_file: ${{ steps.release.outputs.release_file }}
    steps:
      # actions/checkout v7.0.1, pinned to its verified commit.
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate annotated tag, version, notes, and main ancestry
        id: release
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
            echo "Invalid beta tag: $TAG" >&2
            exit 1
          fi
          if [[ "$(git cat-file -t "refs/tags/$TAG")" != "tag" ]]; then
            echo "$TAG must be an annotated tag" >&2
            exit 1
          fi

          commit="$(git rev-parse "refs/tags/$TAG^{commit}")"
          git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "$commit is not contained in origin/main" >&2
            exit 1
          fi

          plist="prototype/GodoxMacControlPrototype/Info.plist"
          version="$(plutil -extract CFBundleShortVersionString raw -o - "$plist")"
          build_number="$(plutil -extract CFBundleVersion raw -o - "$plist")"
          expected_tag="v${version}-beta.${build_number}"
          if [[ "$TAG" != "$expected_tag" ]]; then
            echo "Tag $TAG does not match plist version/build $expected_tag" >&2
            exit 1
          fi

          release_file="docs/releases/${TAG}.md"
          if [[ ! -s "$release_file" ]]; then
            echo "Missing release notes: $release_file" >&2
            exit 1
          fi

          {
            echo "version=$version"
            echo "build_number=$build_number"
            echo "commit=$commit"
            echo "release_file=$release_file"
          } >>"$GITHUB_OUTPUT"

  native:
    name: Native gate (${{ matrix.expected_arch }})
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            expected_arch: arm64
          - runner: macos-15-intel
            expected_arch: x86_64
    env:
      EXPECTED_ARCH: ${{ matrix.expected_arch }}
    steps:
      # actions/checkout v7.0.1, pinned to its verified commit.
      - name: Check out tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false

      - name: Verify native runner architecture
        shell: bash
        run: |
          set -euo pipefail
          actual_arch="$(uname -m)"
          if [[ "$actual_arch" != "$EXPECTED_ARCH" ]]; then
            echo "Expected $EXPECTED_ARCH runner, received $actual_arch" >&2
            exit 1
          fi

      - name: Type-check, test, and build
        run: |
          make mac-prototype-check TARGET_ARCH="$EXPECTED_ARCH"
          make mac-prototype-test TARGET_ARCH="$EXPECTED_ARCH"
          make mac-prototype-build TARGET_ARCH="$EXPECTED_ARCH"
          lipo prototype/GodoxMacControlPrototype/Build/estrobo.app/Contents/MacOS/estrobo \
            -verify_arch "$EXPECTED_ARCH"

  build-draft:
    name: Sign, attest, and create draft
    needs:
      - validate
      - native
    runs-on: macos-15
    timeout-minutes: 35
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.validate.outputs.version }}
      BUILD_NUMBER: ${{ needs.validate.outputs.build_number }}
      RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
      RELEASE_FILE: ${{ needs.validate.outputs.release_file }}
      SIGNING_IDENTITY: ${{ secrets.ESTROBO_SIGNING_IDENTITY }}
      SIGNING_KEYCHAIN: ${{ runner.temp }}/estrobo-signing.keychain-db
      SIGNING_P12: ${{ runner.temp }}/estrobo-signing.p12
    steps:
      # actions/checkout v7.0.1, pinned to its verified commit.
      - name: Check out tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Import stable signing identity
        shell: bash
        env:
          SIGNING_P12_BASE64: ${{ secrets.ESTROBO_SIGNING_P12_BASE64 }}
          SIGNING_P12_PASSWORD: ${{ secrets.ESTROBO_SIGNING_P12_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          : "${SIGNING_IDENTITY:?Missing ESTROBO_SIGNING_IDENTITY}"
          : "${SIGNING_P12_BASE64:?Missing ESTROBO_SIGNING_P12_BASE64}"
          : "${SIGNING_P12_PASSWORD:?Missing ESTROBO_SIGNING_P12_PASSWORD}"

          keychain_password="$(openssl rand -hex 32)"
          echo "::add-mask::$keychain_password"
          printf '%s' "$SIGNING_P12_BASE64" | /usr/bin/base64 -D >"$SIGNING_P12"
          security create-keychain -p "$keychain_password" "$SIGNING_KEYCHAIN"
          security set-keychain-settings -lut 21600 "$SIGNING_KEYCHAIN"
          security unlock-keychain -p "$keychain_password" "$SIGNING_KEYCHAIN"
          security import "$SIGNING_P12" \
            -k "$SIGNING_KEYCHAIN" \
            -P "$SIGNING_P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          # Trust exists only on the ephemeral build host so macOS recognizes
          # the imported private key as a code-signing identity. Participants
          # never install or trust this certificate.
          sudo security add-trusted-cert \
            -d \
            -r trustRoot \
            -p codeSign \
            -k /Library/Keychains/System.keychain \
            release/signing/estrobo-beta-signing.cer
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$SIGNING_KEYCHAIN" >/dev/null

          identities="$(security find-identity -v -p codesigning "$SIGNING_KEYCHAIN")"
          printf '%s\n' "$identities"
          if ! grep -Fq "\"$SIGNING_IDENTITY\"" <<<"$identities"; then
            echo "Expected signing identity was not imported" >&2
            exit 1
          fi

      - name: Verify imported certificate fingerprint
        shell: bash
        run: |
          set -euo pipefail
          public_certificate="release/signing/estrobo-beta-signing.cer"
          fingerprint_file="release/signing/estrobo-beta-signing.sha256"
          scripts/verify-signing-certificate.sh \
            "$public_certificate" \
            "$fingerprint_file"

          expected="$(awk 'NF { print toupper($1); exit }' "$fingerprint_file")"
          [[ "$expected" =~ ^[0-9A-F]{64}$ ]]

          security find-certificate \
            -c "$SIGNING_IDENTITY" \
            -p "$SIGNING_KEYCHAIN" >"$RUNNER_TEMP/imported-signing.pem"
          openssl x509 \
            -in "$RUNNER_TEMP/imported-signing.pem" \
            -outform DER \
            -out "$RUNNER_TEMP/imported-signing.cer"
          imported_digest="$(shasum -a 256 "$RUNNER_TEMP/imported-signing.cer" | awk '{ print toupper($1) }')"
          [[ "$imported_digest" == "$expected" ]]
          cmp -s "$public_certificate" "$RUNNER_TEMP/imported-signing.cer"

      - name: Build and sign universal app
        run: |
          make mac-prototype-release \
            VERSION="$VERSION" \
            BUILD_NUMBER="$BUILD_NUMBER" \
            SIGNING_IDENTITY="$SIGNING_IDENTITY" \
            SIGNING_KEYCHAIN="$SIGNING_KEYCHAIN"

      - name: Remove build-host trust before Gatekeeper verification
        shell: bash
        run: |
          set -euo pipefail
          sudo security remove-trusted-cert \
            -d \
            release/signing/estrobo-beta-signing.cer

      - name: Verify and package the already-signed app
        run: |
          make mac-prototype-package-existing \
            VERSION="$VERSION" \
            BUILD_NUMBER="$BUILD_NUMBER" \
            TAG="$TAG" \
            COMMIT="$RELEASE_COMMIT"
          shasum -a 256 -c Dist/SHA256SUMS

      # actions/attest v4.2.2, pinned to its verified commit.
      - name: Generate GitHub artifact attestations
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: |
            Dist/*.zip
            Dist/*-manifest.json
            Dist/SHA256SUMS

      - name: Create or refresh draft prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            draft="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq .draft)"
            if [[ "$draft" != "true" ]]; then
              echo "Refusing to overwrite a published release" >&2
              exit 1
            fi
            gh release edit "$TAG" \
              --draft \
              --prerelease \
              --title "estrobo ${TAG#v}" \
              --notes-file "$RELEASE_FILE"
            gh release upload "$TAG" --clobber \
              Dist/*.zip \
              Dist/*-manifest.json \
              Dist/SHA256SUMS
          else
            gh release create "$TAG" \
              --verify-tag \
              --draft \
              --prerelease \
              --title "estrobo ${TAG#v}" \
              --notes-file "$RELEASE_FILE" \
              Dist/*.zip \
              Dist/*-manifest.json \
              Dist/SHA256SUMS
          fi
          echo "Draft retained until public-beta approval and exact smoke marker."

      - name: Remove temporary signing material
        if: ${{ always() }}
        shell: bash
        run: |
          sudo security remove-trusted-cert \
            -d \
            release/signing/estrobo-beta-signing.cer >/dev/null 2>&1 || true
          security delete-keychain "$SIGNING_KEYCHAIN" >/dev/null 2>&1 || true
          /bin/rm -f -- \
            "$SIGNING_P12" \
            "$RUNNER_TEMP/imported-signing.pem" \
            "$RUNNER_TEMP/imported-signing.cer"

  publish:
    name: Publish approved public beta
    needs:
      - validate
      - build-draft
    runs-on: macos-15
    timeout-minutes: 10
    permissions:
      contents: write
    environment:
      name: public-beta
      url: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}
    steps:
      - name: Require smoke approval for this exact tag
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          APPROVED_TAG: ${{ vars.PUBLIC_BETA_SMOKE_APPROVED_TAG }}
        run: |
          set -euo pipefail
          if [[ "$APPROVED_TAG" != "$TAG" ]]; then
            echo "Manual smoke is still pending for $TAG." >&2
            echo "Keep the release draft and set public-beta variable PUBLIC_BETA_SMOKE_APPROVED_TAG=$TAG only after the clean-Mac and hardware gates pass." >&2
            exit 1
          fi

      - name: Publish as prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          draft="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq .draft)"
          [[ "$draft" == "true" ]]
          gh release edit "$TAG" --draft=false --prerelease
