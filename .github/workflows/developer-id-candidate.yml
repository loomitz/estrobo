name: Developer ID candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: developer-id-candidate-${{ github.sha }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare encrypted candidate
    runs-on: macos-15
    timeout-minutes: 10
    outputs:
      commit: ${{ steps.candidate.outputs.commit }}
      version: ${{ steps.candidate.outputs.version }}
      build_number: ${{ steps.candidate.outputs.build_number }}
      candidate_tag: ${{ steps.candidate.outputs.candidate_tag }}
    steps:
      # actions/checkout v7.0.1, pinned to its verified commit.
      - name: Check out protected main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate source commit and version
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Developer ID candidates must be dispatched from protected main" >&2
            exit 1
          fi

          commit="$GITHUB_SHA"
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "$commit is not contained in origin/main" >&2
            exit 1
          fi

          plist="prototype/GodoxMacControlPrototype/Info.plist"
          version="$(plutil -extract CFBundleShortVersionString raw -o - "$plist")"
          build_number="$(plutil -extract CFBundleVersion raw -o - "$plist")"
          candidate_tag="v${version}-beta.${build_number}"
          if [[ ! "$candidate_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
            echo "Invalid version/build candidate: $candidate_tag" >&2
            exit 1
          fi
          tag_lookup_status=0
          git ls-remote --exit-code origin "refs/tags/$candidate_tag" \
            >/dev/null 2>&1 || tag_lookup_status=$?
          case "$tag_lookup_status" in
            0)
              echo "Refusing a pre-tag candidate because $candidate_tag already exists remotely" >&2
              exit 1
              ;;
            2)
              ;;
            *)
              echo "Could not prove that $candidate_tag is absent from origin" >&2
              exit "$tag_lookup_status"
              ;;
          esac

          {
            echo "commit=$commit"
            echo "version=$version"
            echo "build_number=$build_number"
            echo "candidate_tag=$candidate_tag"
          } >>"$GITHUB_OUTPUT"

      - name: Test Developer ID tooling without credentials
        run: make mac-prototype-developer-id-tools-test

  native:
    name: Native gate (${{ matrix.expected_arch }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            expected_arch: arm64
          - runner: macos-15-intel
            expected_arch: x86_64
    env:
      EXPECTED_ARCH: ${{ matrix.expected_arch }}
    steps:
      # actions/checkout v7.0.1, pinned to its verified commit.
      - name: Check out candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false

      - name: Verify native runner architecture
        shell: bash
        run: |
          set -euo pipefail
          actual_arch="$(uname -m)"
          if [[ "$actual_arch" != "$EXPECTED_ARCH" ]]; then
            echo "Expected $EXPECTED_ARCH runner, received $actual_arch" >&2
            exit 1
          fi

      - name: Type-check, test, and build
        run: |
          make mac-prototype-check TARGET_ARCH="$EXPECTED_ARCH"
          make mac-prototype-test TARGET_ARCH="$EXPECTED_ARCH"
          make mac-prototype-build TARGET_ARCH="$EXPECTED_ARCH"
          lipo prototype/GodoxMacControlPrototype/Build/estrobo.app/Contents/MacOS/estrobo \
            -verify_arch "$EXPECTED_ARCH"

  sign-and-notarize:
    name: Sign and notarize encrypted candidate
    needs:
      - prepare
      - native
    if: ${{ github.run_attempt == 1 }}
    runs-on: macos-15
    timeout-minutes: 120
    environment:
      name: developer-id-signing
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
      CANDIDATE_TAG: ${{ needs.prepare.outputs.candidate_tag }}
      RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
      DEVELOPER_ID_TEAM_ID: ${{ vars.ESTROBO_APPLE_TEAM_ID }}
      EXPECTED_CERTIFICATE_SHA256: ${{ vars.ESTROBO_DEVELOPER_ID_CERT_SHA256 }}
    steps:
      # actions/checkout v7.0.1, pinned to its verified commit.
      - name: Check out candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false

      - name: Prepare ephemeral signing and notarization paths
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "DEVELOPER_ID_KEYCHAIN=$RUNNER_TEMP/estrobo-developer-id.keychain-db"
            echo "DEVELOPER_ID_P12=$RUNNER_TEMP/estrobo-developer-id.p12"
            echo "NOTARY_API_KEY=$RUNNER_TEMP/estrobo-notary-api-key.p8"
            echo "NOTARIZATION_DIR=$GITHUB_WORKSPACE/prototype/GodoxMacControlPrototype/Build/Notarization"
            echo "NOTARIZATION_UPLOAD_ARCHIVE=$GITHUB_WORKSPACE/prototype/GodoxMacControlPrototype/Build/Notarization/notary-upload.zip"
            echo "TRANSFER_DIR=$RUNNER_TEMP/estrobo-developer-id-transfer"
            echo "TRANSFER_ARCHIVE=$RUNNER_TEMP/estrobo-developer-id-transfer.tar.gz"
            echo "TRANSFER_ENCRYPTED=$RUNNER_TEMP/estrobo-developer-id-transfer.tar.gz.enc"
            echo "TRANSFER_ENCRYPTED_SHA256=$RUNNER_TEMP/estrobo-developer-id-transfer.tar.gz.enc.sha256"
            echo "DIAGNOSTICS_ARCHIVE=$RUNNER_TEMP/estrobo-developer-id-diagnostics.tar.gz"
            echo "DIAGNOSTICS_ENCRYPTED=$RUNNER_TEMP/estrobo-developer-id-diagnostics.tar.gz.enc"
            echo "DIAGNOSTICS_ENCRYPTED_SHA256=$RUNNER_TEMP/estrobo-developer-id-diagnostics.tar.gz.enc.sha256"
          } >>"$GITHUB_ENV"

      - name: Validate candidate artifact encryption before signing
        shell: bash
        env:
          CANDIDATE_ARTIFACT_PASSWORD: ${{ secrets.ESTROBO_CANDIDATE_ARTIFACT_PASSWORD }}
        run: |
          set -euo pipefail
          : "${CANDIDATE_ARTIFACT_PASSWORD:?Missing ESTROBO_CANDIDATE_ARTIFACT_PASSWORD}"
          if (( ${#CANDIDATE_ARTIFACT_PASSWORD} < 32 )); then
            echo "ESTROBO_CANDIDATE_ARTIFACT_PASSWORD must contain at least 32 characters" >&2
            exit 1
          fi
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -md sha256 -help \
            >/dev/null 2>&1

      - name: Import Developer ID identity and notary API key
        shell: bash
        timeout-minutes: 5
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.ESTROBO_DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.ESTROBO_DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_API_KEY_P8_BASE64: ${{ secrets.ESTROBO_NOTARY_API_KEY_P8_BASE64 }}
          NOTARY_API_KEY_ID: ${{ secrets.ESTROBO_NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.ESTROBO_NOTARY_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          umask 077
          : "${DEVELOPER_ID_P12_BASE64:?Missing ESTROBO_DEVELOPER_ID_P12_BASE64}"
          : "${DEVELOPER_ID_P12_PASSWORD:?Missing ESTROBO_DEVELOPER_ID_P12_PASSWORD}"
          : "${NOTARY_API_KEY_P8_BASE64:?Missing ESTROBO_NOTARY_API_KEY_P8_BASE64}"
          : "${NOTARY_API_KEY_ID:?Missing ESTROBO_NOTARY_API_KEY_ID}"
          : "${NOTARY_API_ISSUER_ID:?Missing ESTROBO_NOTARY_API_ISSUER_ID}"
          : "${DEVELOPER_ID_TEAM_ID:?Missing ESTROBO_APPLE_TEAM_ID variable}"
          : "${EXPECTED_CERTIFICATE_SHA256:?Missing ESTROBO_DEVELOPER_ID_CERT_SHA256 variable}"
          if [[ "${RUNNER_ENVIRONMENT:-}" != "github-hosted" ]]; then
            echo "Developer ID signing is restricted to an ephemeral GitHub-hosted runner" >&2
            exit 1
          fi
          [[ "$DEVELOPER_ID_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]]
          [[ "$EXPECTED_CERTIFICATE_SHA256" =~ ^[0-9A-Fa-f]{64}$ ]]

          public_certificate="release/signing/estrobo-developer-id-application.cer"
          fingerprint_file="release/signing/estrobo-developer-id-application.sha256"
          scripts/verify-developer-id-certificate.sh \
            "$public_certificate" \
            "$fingerprint_file" \
            "$DEVELOPER_ID_TEAM_ID"
          pinned_digest="$(awk 'NF { print toupper($1); exit }' "$fingerprint_file")"
          expected_digest="$(printf '%s' "$EXPECTED_CERTIFICATE_SHA256" | tr '[:lower:]' '[:upper:]')"
          if [[ "$pinned_digest" != "$expected_digest" ]]; then
            echo "Versioned certificate digest does not match the protected environment variable" >&2
            exit 1
          fi

          keychain_password="$(openssl rand -hex 32)"
          echo "::add-mask::$keychain_password"
          printf '%s' "$DEVELOPER_ID_P12_BASE64" | /usr/bin/base64 -D >"$DEVELOPER_ID_P12"
          printf '%s' "$NOTARY_API_KEY_P8_BASE64" | /usr/bin/base64 -D >"$NOTARY_API_KEY"
          chmod 600 "$DEVELOPER_ID_P12" "$NOTARY_API_KEY"

          security create-keychain -p "$keychain_password" "$DEVELOPER_ID_KEYCHAIN"
          security set-keychain-settings -lut 21600 "$DEVELOPER_ID_KEYCHAIN"
          security unlock-keychain -p "$keychain_password" "$DEVELOPER_ID_KEYCHAIN"
          security list-keychains -d user -s "$DEVELOPER_ID_KEYCHAIN"
          security default-keychain -d user -s "$DEVELOPER_ID_KEYCHAIN"
          security import "$DEVELOPER_ID_P12" \
            -k "$DEVELOPER_ID_KEYCHAIN" \
            -P "$DEVELOPER_ID_P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$DEVELOPER_ID_KEYCHAIN" >/dev/null

          signing_identity="$(openssl x509 \
            -inform DER \
            -in "$public_certificate" \
            -noout \
            -fingerprint \
            -sha1 | tr -d ':' | awk -F= '{ print toupper($2) }')"
          [[ "$signing_identity" =~ ^[0-9A-F]{40}$ ]]
          identities="$(security find-identity -v -p codesigning "$DEVELOPER_ID_KEYCHAIN")"
          printf '%s\n' "$identities"
          if ! grep -Fq "$signing_identity" <<<"$identities"; then
            echo "The imported P12 does not contain the pinned Developer ID identity" >&2
            exit 1
          fi

          {
            echo "DEVELOPER_ID_SIGNING_IDENTITY=$signing_identity"
            echo "NOTARY_API_KEY_ID=$NOTARY_API_KEY_ID"
            echo "NOTARY_API_ISSUER_ID=$NOTARY_API_ISSUER_ID"
          } >>"$GITHUB_ENV"

      - name: Build, sign, and verify before notarization
        timeout-minutes: 20
        run: |
          make mac-prototype-developer-id-release-verify \
            VERSION="$VERSION" \
            BUILD_NUMBER="$BUILD_NUMBER" \
            DEVELOPER_ID_SIGNING_IDENTITY="$DEVELOPER_ID_SIGNING_IDENTITY" \
            DEVELOPER_ID_SIGNING_KEYCHAIN="$DEVELOPER_ID_KEYCHAIN" \
            DEVELOPER_ID_TEAM_ID="$DEVELOPER_ID_TEAM_ID"

      - name: Submit, wait, staple, and validate
        timeout-minutes: 35
        run: |
          make mac-prototype-developer-id-notarize-existing \
            VERSION="$VERSION" \
            BUILD_NUMBER="$BUILD_NUMBER" \
            DEVELOPER_ID_TEAM_ID="$DEVELOPER_ID_TEAM_ID" \
            NOTARY_API_KEY_PATH="$NOTARY_API_KEY" \
            NOTARY_API_KEY_ID="$NOTARY_API_KEY_ID" \
            NOTARY_API_ISSUER_ID="$NOTARY_API_ISSUER_ID" \
            NOTARY_TIMEOUT=25m \
            NOTARIZATION_UPLOAD_ARCHIVE="$NOTARIZATION_UPLOAD_ARCHIVE" \
            NOTARIZATION_DIR="$NOTARIZATION_DIR"

      - name: Verify notarized app and prepare clean-host transfer
        id: prepare_transfer
        timeout-minutes: 5
        run: |
          set -euo pipefail
          make mac-prototype-developer-id-verify-existing \
            VERSION="$VERSION" \
            BUILD_NUMBER="$BUILD_NUMBER" \
            DEVELOPER_ID_TEAM_ID="$DEVELOPER_ID_TEAM_ID"

          mkdir -p "$TRANSFER_DIR"
          ditto -c -k --sequesterRsrc --keepParent \
            prototype/GodoxMacControlPrototype/Build/Universal/estrobo.app \
            "$TRANSFER_DIR/estrobo-stapled-app.zip"
          cp \
            "$NOTARIZATION_DIR/notary-submit.json" \
            "$NOTARIZATION_DIR/notary-wait.json" \
            "$NOTARIZATION_DIR/notary-log.json" \
            "$NOTARIZATION_DIR/notarization-metadata.json" \
            "$TRANSFER_DIR/"
          if find "$TRANSFER_DIR" -type f \( \
            -iname '*.p8' -o \
            -iname '*.p12' -o \
            -iname '*.key' -o \
            -iname '*.pem' -o \
            -iname '*.keychain*' \
          \) -print -quit | grep -q .; then
            echo "Private signing material entered the transfer directory" >&2
            exit 1
          fi

      - name: Remove temporary private material
        id: cleanup
        if: ${{ always() }}
        shell: bash
        timeout-minutes: 4
        run: |
          set -u
          cleanup_status=0
          /bin/rm -f -- "$DEVELOPER_ID_P12" "$NOTARY_API_KEY" || cleanup_status=1
          if [[ -e "$DEVELOPER_ID_KEYCHAIN" ]]; then
            security delete-keychain "$DEVELOPER_ID_KEYCHAIN" >/dev/null || cleanup_status=1
          fi
          for sensitive_path in \
            "$DEVELOPER_ID_P12" \
            "$NOTARY_API_KEY" \
            "$DEVELOPER_ID_KEYCHAIN"; do
            if [[ -e "$sensitive_path" ]]; then
              echo "Temporary private material remains: $sensitive_path" >&2
              cleanup_status=1
            fi
          done
          exit "$cleanup_status"

      - name: Encrypt stapled app for clean-host verification
        id: encrypt_transfer
        if: ${{ always() && steps.cleanup.outcome == 'success' && steps.prepare_transfer.outcome == 'success' }}
        shell: bash
        timeout-minutes: 5
        env:
          CANDIDATE_ARTIFACT_PASSWORD: ${{ secrets.ESTROBO_CANDIDATE_ARTIFACT_PASSWORD }}
        run: |
          set -euo pipefail
          : "${CANDIDATE_ARTIFACT_PASSWORD:?Missing ESTROBO_CANDIDATE_ARTIFACT_PASSWORD}"
          if (( ${#CANDIDATE_ARTIFACT_PASSWORD} < 32 )); then
            echo "ESTROBO_CANDIDATE_ARTIFACT_PASSWORD must contain at least 32 characters" >&2
            exit 1
          fi
          [[ "$TRANSFER_DIR" == "$RUNNER_TEMP/"* ]]
          [[ -f "$TRANSFER_DIR/estrobo-stapled-app.zip" ]]
          umask 077
          tar -czf "$TRANSFER_ARCHIVE" \
            -C "$RUNNER_TEMP" \
            "$(basename "$TRANSFER_DIR")"
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 -md sha256 \
            -pass env:CANDIDATE_ARTIFACT_PASSWORD \
            -in "$TRANSFER_ARCHIVE" \
            -out "$TRANSFER_ENCRYPTED"
          (
            cd "$(dirname "$TRANSFER_ENCRYPTED")"
            shasum -a 256 "$(basename "$TRANSFER_ENCRYPTED")" \
              >"$(basename "$TRANSFER_ENCRYPTED_SHA256")"
          )
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -md sha256 \
            -pass env:CANDIDATE_ARTIFACT_PASSWORD \
            -in "$TRANSFER_ENCRYPTED" | tar -tzf - >/dev/null
          rm -rf -- "$TRANSFER_DIR"
          rm -f -- "$TRANSFER_ARCHIVE"

      # actions/upload-artifact v7.0.1, pinned to its verified commit.
      - name: Upload encrypted stapled app for clean-host verification
        id: upload_transfer
        if: ${{ always() && steps.encrypt_transfer.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: developer-id-stapled-app-encrypted-${{ needs.prepare.outputs.commit }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/estrobo-developer-id-transfer.tar.gz.enc
            ${{ runner.temp }}/estrobo-developer-id-transfer.tar.gz.enc.sha256
          if-no-files-found: error
          overwrite: true
          retention-days: 35

      - name: Encrypt failure diagnostics and exact recovery app
        id: encrypt_recovery
        if: ${{ always() && steps.cleanup.outcome == 'success' && (steps.prepare_transfer.outcome != 'success' || steps.upload_transfer.outcome != 'success') }}
        shell: bash
        timeout-minutes: 7
        env:
          CANDIDATE_ARTIFACT_PASSWORD: ${{ secrets.ESTROBO_CANDIDATE_ARTIFACT_PASSWORD }}
        run: |
          set -euo pipefail
          : "${CANDIDATE_ARTIFACT_PASSWORD:?Missing ESTROBO_CANDIDATE_ARTIFACT_PASSWORD}"
          if (( ${#CANDIDATE_ARTIFACT_PASSWORD} < 32 )); then
            echo "ESTROBO_CANDIDATE_ARTIFACT_PASSWORD must contain at least 32 characters" >&2
            exit 1
          fi
          umask 077
          evidence_files=()
          for evidence_name in \
            notary-upload.zip \
            notary-submit.json \
            notary-wait.json \
            notary-log.json \
            notarization-metadata.json; do
            if [[ -f "$NOTARIZATION_DIR/$evidence_name" ]]; then
              evidence_files+=("$evidence_name")
            fi
          done

          recovery_app="prototype/GodoxMacControlPrototype/Build/Universal/estrobo.app"
          if [[ ! -f "$NOTARIZATION_UPLOAD_ARCHIVE" && -d "$recovery_app" ]]; then
            ditto -c -k --sequesterRsrc --keepParent \
              "$recovery_app" \
              "$NOTARIZATION_DIR/candidate-app-recovery.zip"
            evidence_files+=(candidate-app-recovery.zip)
          fi
          if (( ${#evidence_files[@]} == 0 )); then
            echo "available=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          tar -czf "$DIAGNOSTICS_ARCHIVE" \
            -C "$NOTARIZATION_DIR" \
            "${evidence_files[@]}"
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 -md sha256 \
            -pass env:CANDIDATE_ARTIFACT_PASSWORD \
            -in "$DIAGNOSTICS_ARCHIVE" \
            -out "$DIAGNOSTICS_ENCRYPTED"
          (
            cd "$(dirname "$DIAGNOSTICS_ENCRYPTED")"
            shasum -a 256 "$(basename "$DIAGNOSTICS_ENCRYPTED")" \
              >"$(basename "$DIAGNOSTICS_ENCRYPTED_SHA256")"
          )
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -md sha256 \
            -pass env:CANDIDATE_ARTIFACT_PASSWORD \
            -in "$DIAGNOSTICS_ENCRYPTED" | tar -tzf - >/dev/null
          rm -f -- "$DIAGNOSTICS_ARCHIVE"
          echo "available=true" >>"$GITHUB_OUTPUT"

      # actions/upload-artifact v7.0.1, pinned to its verified commit.
      - name: Upload encrypted recovery evidence
        if: ${{ always() && steps.encrypt_recovery.outputs.available == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: developer-id-notary-recovery-encrypted-${{ needs.prepare.outputs.commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/estrobo-developer-id-diagnostics.tar.gz.enc
            ${{ runner.temp }}/estrobo-developer-id-diagnostics.tar.gz.enc.sha256
          if-no-files-found: error
          retention-days: 30

  verify-and-package:
    name: Verify and package encrypted candidate
    needs:
      - prepare
      - sign-and-notarize
    runs-on: macos-15
    timeout-minutes: 20
    environment:
      name: developer-id-verification
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
      CANDIDATE_TAG: ${{ needs.prepare.outputs.candidate_tag }}
      RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
      DEVELOPER_ID_TEAM_ID: ${{ vars.ESTROBO_APPLE_TEAM_ID }}
    steps:
      # actions/checkout v7.0.1, pinned to its verified commit.
      - name: Check out candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Reconfirm protected main ancestry
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$RELEASE_COMMIT" origin/main

      # actions/download-artifact v8.0.1, pinned to its verified commit.
      - name: Download encrypted stapled app
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: developer-id-stapled-app-encrypted-${{ needs.prepare.outputs.commit }}-${{ github.run_id }}
          path: ${{ runner.temp }}/developer-id-transfer-encrypted

      - name: Decrypt clean-host transfer
        shell: bash
        env:
          CANDIDATE_ARTIFACT_PASSWORD: ${{ secrets.ESTROBO_CANDIDATE_ARTIFACT_PASSWORD }}
        run: |
          set -euo pipefail
          : "${CANDIDATE_ARTIFACT_PASSWORD:?Missing ESTROBO_CANDIDATE_ARTIFACT_PASSWORD}"
          if (( ${#CANDIDATE_ARTIFACT_PASSWORD} < 32 )); then
            echo "ESTROBO_CANDIDATE_ARTIFACT_PASSWORD must contain at least 32 characters" >&2
            exit 1
          fi
          encrypted_dir="$RUNNER_TEMP/developer-id-transfer-encrypted"
          encrypted_archive="$encrypted_dir/estrobo-developer-id-transfer.tar.gz.enc"
          (
            cd "$encrypted_dir"
            shasum -a 256 -c estrobo-developer-id-transfer.tar.gz.enc.sha256
          )
          umask 077
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -md sha256 \
            -pass env:CANDIDATE_ARTIFACT_PASSWORD \
            -in "$encrypted_archive" | tar -xzf - -C "$RUNNER_TEMP"
          [[ -f "$RUNNER_TEMP/estrobo-developer-id-transfer/estrobo-stapled-app.zip" ]]

      - name: Extract, verify, and package on the clean host
        shell: bash
        run: |
          set -euo pipefail
          : "${DEVELOPER_ID_TEAM_ID:?Missing ESTROBO_APPLE_TEAM_ID variable}"
          build_dir="$GITHUB_WORKSPACE/BuildDeveloperID"
          dist_dir="$GITHUB_WORKSPACE/DistDeveloperID"
          app_dir="$build_dir/Universal"
          rm -rf -- "$build_dir" "$dist_dir"
          mkdir -p "$app_dir"
          ditto -x -k \
            "$RUNNER_TEMP/estrobo-developer-id-transfer/estrobo-stapled-app.zip" \
            "$app_dir"

          make mac-prototype-developer-id-package-existing \
            BUILD_DIR="$build_dir" \
            DIST_DIR="$dist_dir" \
            VERSION="$VERSION" \
            BUILD_NUMBER="$BUILD_NUMBER" \
            TAG="$CANDIDATE_TAG" \
            COMMIT="$RELEASE_COMMIT" \
            DEVELOPER_ID_TEAM_ID="$DEVELOPER_ID_TEAM_ID" \
            NOTARIZATION_SUBMIT_RESULT="$RUNNER_TEMP/estrobo-developer-id-transfer/notary-submit.json" \
            NOTARIZATION_WAIT_RESULT="$RUNNER_TEMP/estrobo-developer-id-transfer/notary-wait.json" \
            NOTARIZATION_LOG="$RUNNER_TEMP/estrobo-developer-id-transfer/notary-log.json" \
            NOTARIZATION_METADATA="$RUNNER_TEMP/estrobo-developer-id-transfer/notarization-metadata.json"

          (
            cd "$dist_dir"
            shasum -a 256 -c *-SHA256SUMS
          )

      - name: Reconfirm candidate remains pre-tag
        shell: bash
        run: |
          set -euo pipefail
          tag_lookup_status=0
          git ls-remote --exit-code origin "refs/tags/$CANDIDATE_TAG" \
            >/dev/null 2>&1 || tag_lookup_status=$?
          case "$tag_lookup_status" in
            0)
              echo "Refusing to package because $CANDIDATE_TAG now exists remotely" >&2
              exit 1
              ;;
            2)
              ;;
            *)
              echo "Could not reconfirm that $CANDIDATE_TAG is absent from origin" >&2
              exit "$tag_lookup_status"
              ;;
          esac

      - name: Encrypt final Developer ID candidate
        shell: bash
        env:
          CANDIDATE_ARTIFACT_PASSWORD: ${{ secrets.ESTROBO_CANDIDATE_ARTIFACT_PASSWORD }}
        run: |
          set -euo pipefail
          : "${CANDIDATE_ARTIFACT_PASSWORD:?Missing ESTROBO_CANDIDATE_ARTIFACT_PASSWORD}"
          if (( ${#CANDIDATE_ARTIFACT_PASSWORD} < 32 )); then
            echo "ESTROBO_CANDIDATE_ARTIFACT_PASSWORD must contain at least 32 characters" >&2
            exit 1
          fi
          candidate_archive="$RUNNER_TEMP/estrobo-developer-id-candidate.tar.gz"
          candidate_encrypted="$candidate_archive.enc"
          candidate_checksum="$candidate_encrypted.sha256"
          umask 077
          tar -czf "$candidate_archive" \
            -C "$GITHUB_WORKSPACE" \
            DistDeveloperID
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 -md sha256 \
            -pass env:CANDIDATE_ARTIFACT_PASSWORD \
            -in "$candidate_archive" \
            -out "$candidate_encrypted"
          (
            cd "$RUNNER_TEMP"
            shasum -a 256 "$(basename "$candidate_encrypted")" \
              >"$(basename "$candidate_checksum")"
          )
          roundtrip_dir="$RUNNER_TEMP/estrobo-developer-id-candidate-roundtrip"
          rm -rf -- "$roundtrip_dir"
          mkdir -p "$roundtrip_dir"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -md sha256 \
            -pass env:CANDIDATE_ARTIFACT_PASSWORD \
            -in "$candidate_encrypted" | tar -xzf - -C "$roundtrip_dir"
          (
            cd "$roundtrip_dir/DistDeveloperID"
            shasum -a 256 -c *-SHA256SUMS
          )
          rm -f -- "$candidate_archive"
          rm -rf -- "$roundtrip_dir"
          rm -rf -- "$GITHUB_WORKSPACE/DistDeveloperID"

      # actions/upload-artifact v7.0.1, pinned to its verified commit.
      - name: Upload encrypted Developer ID candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: developer-id-candidate-encrypted-${{ needs.prepare.outputs.commit }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/estrobo-developer-id-candidate.tar.gz.enc
            ${{ runner.temp }}/estrobo-developer-id-candidate.tar.gz.enc.sha256
          if-no-files-found: error
          overwrite: true
          retention-days: 7
