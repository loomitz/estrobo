<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">Estrobo — Tus flashes. En sincronía.</title>
  <desc id="desc">Pieza vertical para Facebook con la interfaz real de Estrobo sobre un estudio fotográfico oscuro.</desc>
  <defs>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111e" stop-opacity="0.96"/>
      <stop offset="0.5" stop-color="#06111e" stop-opacity="0.67"/>
      <stop offset="1" stop-color="#06111e" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="bottomShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#06111e" stop-opacity="0"/>
      <stop offset="1" stop-color="#06111e" stop-opacity="0.84"/>
    </linearGradient>
    <filter id="appShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="26" stdDeviation="28" flood-color="#000000" flood-opacity="0.58"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="1080" height="1350" fill="#06111e"/>
  <image xlink:href="estrobo-facebook-background.png" x="0" y="0" width="1080" height="1350" preserveAspectRatio="xMidYMid slice"/>
  <rect width="1080" height="1000" fill="url(#shade)"/>
  <rect y="810" width="1080" height="540" fill="url(#bottomShade)"/>

  <image xlink:href="estrobo-wordmark-white.png" x="70" y="66" width="287" height="60" preserveAspectRatio="xMinYMid meet"/>

  <text x="72" y="193" fill="#ff9d00" font-family="Helvetica Neue, Arial, sans-serif" font-size="25" font-weight="700" letter-spacing="4.8">BETA PÚBLICA GRATUITA PARA MACOS</text>
  <text x="66" y="323" fill="#ffffff" font-family="Helvetica Neue, Arial, sans-serif" font-size="102" font-weight="700" letter-spacing="-5.5">
    <tspan x="66" dy="0">Tus flashes.</tspan>
    <tspan x="66" dy="98">En sincronía.</tspan>
  </text>
  <text x="72" y="505" fill="#e8edf4" font-family="Helvetica Neue, Arial, sans-serif" font-size="31" font-weight="400" letter-spacing="-0.4">
    <tspan x="72" dy="0">Controla grupos, potencia y modelado</tspan>
    <tspan x="72" dy="43">desde tu Mac.</tspan>
  </text>

  <circle cx="80" cy="605" r="13" fill="#5ce1b3" opacity="0.23" filter="url(#glow)"/>
  <circle cx="80" cy="605" r="6" fill="#5ce1b3"/>
  <text x="101" y="614" fill="#c8d2df" font-family="Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="500" letter-spacing="0.35">macOS 13+ · Apple Silicon + Intel · Todo permanece local</text>

  <g filter="url(#appShadow)" transform="rotate(-1.15 540 1015)">
    <rect x="66" y="653" width="948" height="724" rx="24" fill="#111820" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2"/>
    <image xlink:href="estrobo-canales-social.png" x="66" y="653" width="948" height="724" preserveAspectRatio="xMidYMid meet"/>
  </g>

  <rect x="748" y="1284" width="262" height="42" rx="21" fill="#06111e" fill-opacity="0.88" stroke="#ffffff" stroke-opacity="0.15"/>
  <text x="879" y="1311" text-anchor="middle" fill="#ffffff" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="0.6">INTERFAZ REAL · MODO SIMULADO</text>
</svg>
