name: Release public beta

on:
  push:
    tags:
      - "v*-beta.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated beta tag to rebuild
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate beta tag
    runs-on: macos-15
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      build_number: ${{ steps.release.outputs.build_number }}
      commit: ${{ steps.release.outputs.commit }}
      tag_object: ${{ steps.release.outputs.tag_object }}
      release_file: ${{ steps.release.outputs.release_file }}
    steps:
      # actions/checkout v7.0.1, pinned to its verified commit.
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Validate annotated tag, version, notes, and main ancestry
        id: release
        shell: bash
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
              echo "Manual rebuilds must execute from protected main" >&2
              exit 1
            fi
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
            echo "Invalid beta tag: $TAG" >&2
            exit 1
          fi
          git fetch --no-tags origin \
            "refs/tags/$TAG:refs/tags/$TAG"
          if [[ "$(git cat-file -t "refs/tags/$TAG")" != "tag" ]]; then
            echo "$TAG must be an annotated tag" >&2
            exit 1
          fi

          tag_object="$(git rev-parse "refs/tags/$TAG")"
          commit="$(git rev-parse "refs/tags/$TAG^{commit}")"
          git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "$commit is not contained in origin/main" >&2
            exit 1
          fi

          # Manual rebuilds take their workflow definition from protected main,
          # while every source-bearing job checks out this exact tagged commit.
          plist="prototype/GodoxMacControlPrototype/Info.plist"
          version="$(
            git show "$commit:$plist" |
              plutil -extract CFBundleShortVersionString raw -o - -- -
          )"
          build_number="$(
            git show "$commit:$plist" |
              plutil -extract CFBundleVersion raw -o - -- -
          )"
          expected_tag="v${version}-beta.${build_number}"
          if [[ "$TAG" != "$expected_tag" ]]; then
            echo "Tag $TAG does not match plist version/build $expected_tag" >&2
            exit 1
          fi

          release_file="docs/releases/${TAG}.md"
          if ! git cat-file -e "$commit:$release_file" || \
            [[ "$(git cat-file -s "$commit:$release_file")" -eq 0 ]]; then
            echo "Missing release notes: $release_file" >&2
            exit 1
          fi

          {
            echo "tag=$TAG"
            echo "version=$version"
            echo "build_number=$build_number"
            echo "commit=$commit"
            echo "tag_object=$tag_object"
            echo "release_file=$release_file"
          } >>"$GITHUB_OUTPUT"

  native:
    name: Native gate (${{ matrix.expected_arch }})
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            expected_arch: arm64
          - runner: macos-15-intel
            expected_arch: x86_64
    env:
      EXPECTED_ARCH: ${{ matrix.expected_arch }}
    steps:
      # actions/checkout v7.0.1, pinned to its verified commit.
      - name: Check out tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false

      - name: Verify native runner architecture
        shell: bash
        run: |
          set -euo pipefail
          actual_arch="$(uname -m)"
          if [[ "$actual_arch" != "$EXPECTED_ARCH" ]]; then
            echo "Expected $EXPECTED_ARCH runner, received $actual_arch" >&2
            exit 1
          fi

      - name: Type-check, test, and build
        run: |
          make mac-prototype-check TARGET_ARCH="$EXPECTED_ARCH"
          make mac-prototype-test TARGET_ARCH="$EXPECTED_ARCH"
          make mac-prototype-build TARGET_ARCH="$EXPECTED_ARCH"
          lipo prototype/GodoxMacControlPrototype/Build/estrobo.app/Contents/MacOS/estrobo \
            -verify_arch "$EXPECTED_ARCH"

  sign:
    name: Build and sign universal app
    needs:
      - validate
      - native
    runs-on: macos-15
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      TAG: ${{ needs.validate.outputs.tag }}
      VERSION: ${{ needs.validate.outputs.version }}
      BUILD_NUMBER: ${{ needs.validate.outputs.build_number }}
      RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
      RELEASE_FILE: ${{ needs.validate.outputs.release_file }}
    steps:
      # actions/checkout v7.0.1, pinned to its verified commit.
      - name: Check out tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare ephemeral signing paths
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "SIGNING_KEYCHAIN=$RUNNER_TEMP/estrobo-signing.keychain-db"
            echo "SIGNING_P12=$RUNNER_TEMP/estrobo-signing.p12"
          } >>"$GITHUB_ENV"

      - name: Import stable signing identity
        shell: bash
        timeout-minutes: 5
        env:
          SIGNING_P12_BASE64: ${{ secrets.ESTROBO_SIGNING_P12_BASE64 }}
          SIGNING_P12_PASSWORD: ${{ secrets.ESTROBO_SIGNING_P12_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          : "${SIGNING_P12_BASE64:?Missing ESTROBO_SIGNING_P12_BASE64}"
          : "${SIGNING_P12_PASSWORD:?Missing ESTROBO_SIGNING_P12_PASSWORD}"

          keychain_password="$(openssl rand -hex 32)"
          echo "::add-mask::$keychain_password"
          printf '%s' "$SIGNING_P12_BASE64" | /usr/bin/base64 -D >"$SIGNING_P12"
          security create-keychain -p "$keychain_password" "$SIGNING_KEYCHAIN"
          security set-keychain-settings -lut 21600 "$SIGNING_KEYCHAIN"
          security unlock-keychain -p "$keychain_password" "$SIGNING_KEYCHAIN"
          security list-keychains -d user -s "$SIGNING_KEYCHAIN"
          security default-keychain -d user -s "$SIGNING_KEYCHAIN"
          security import "$SIGNING_P12" \
            -k "$SIGNING_KEYCHAIN" \
            -P "$SIGNING_P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          # Trust exists only on the ephemeral build host so macOS recognizes
          # the imported private key as a code-signing identity. Participants
          # never install or trust this certificate.
          echo "TRUSTED_CERT_CLEANUP_REQUIRED=1" >>"$GITHUB_ENV"
          sudo -n security add-trusted-cert \
            -d \
            -r trustRoot \
            -p codeSign \
            -k /Library/Keychains/System.keychain \
            release/signing/estrobo-beta-signing.cer
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$SIGNING_KEYCHAIN" >/dev/null

          signing_identity="$(openssl x509 \
            -inform DER \
            -in release/signing/estrobo-beta-signing.cer \
            -noout \
            -fingerprint \
            -sha1 | tr -d ':' | awk -F= '{ print toupper($2) }')"
          [[ "$signing_identity" =~ ^[0-9A-F]{40}$ ]]
          echo "SIGNING_IDENTITY=$signing_identity" >>"$GITHUB_ENV"

          identities="$(security find-identity -v -p codesigning "$SIGNING_KEYCHAIN")"
          printf '%s\n' "$identities"
          if ! grep -Fq "$signing_identity" <<<"$identities"; then
            echo "Expected signing identity was not imported" >&2
            exit 1
          fi

      - name: Verify imported certificate fingerprint
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail
          public_certificate="release/signing/estrobo-beta-signing.cer"
          fingerprint_file="release/signing/estrobo-beta-signing.sha256"
          scripts/verify-signing-certificate.sh \
            "$public_certificate" \
            "$fingerprint_file"

          expected="$(awk 'NF { print toupper($1); exit }' "$fingerprint_file")"
          [[ "$expected" =~ ^[0-9A-F]{64}$ ]]

          security find-certificate \
            -c "Estrobo Public Beta Signing" \
            -p "$SIGNING_KEYCHAIN" >"$RUNNER_TEMP/imported-signing.pem"
          openssl x509 \
            -in "$RUNNER_TEMP/imported-signing.pem" \
            -outform DER \
            -out "$RUNNER_TEMP/imported-signing.cer"
          imported_digest="$(shasum -a 256 "$RUNNER_TEMP/imported-signing.cer" | awk '{ print toupper($1) }')"
          [[ "$imported_digest" == "$expected" ]]
          cmp -s "$public_certificate" "$RUNNER_TEMP/imported-signing.cer"

      - name: Build and sign universal app
        timeout-minutes: 20
        run: |
          make mac-prototype-release \
            VERSION="$VERSION" \
            BUILD_NUMBER="$BUILD_NUMBER" \
            SIGNING_IDENTITY="$SIGNING_IDENTITY" \
            SIGNING_KEYCHAIN="$SIGNING_KEYCHAIN"

      - name: Preserve the signed app for clean-host verification
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail
          codesign --verify --deep --strict --verbose=2 \
            prototype/GodoxMacControlPrototype/Build/Universal/estrobo.app
          ditto -c -k --sequesterRsrc --keepParent \
            prototype/GodoxMacControlPrototype/Build/Universal/estrobo.app \
            "$RUNNER_TEMP/estrobo-signed-app.zip"

      - name: Remove temporary signing material
        if: ${{ always() }}
        shell: bash
        timeout-minutes: 4
        run: |
          cleanup_status=0
          lookup_system_certificate() {
            local lookup_output
            local lookup_status
            set +e
            lookup_output="$(sudo -n security find-certificate \
              -a \
              -Z \
              -c "Estrobo Public Beta Signing" \
              /Library/Keychains/System.keychain 2>&1)"
            lookup_status=$?
            set -e
            case "$lookup_status" in
              0)
                printf '%s\n' "$lookup_output"
                ;;
              44)
                return 1
                ;;
              *)
                printf 'System keychain lookup failed (%s): %s\n' \
                  "$lookup_status" \
                  "$lookup_output" >&2
                return 2
                ;;
            esac
          }

          signing_identity="$(openssl x509 \
            -inform DER \
            -in release/signing/estrobo-beta-signing.cer \
            -noout \
            -fingerprint \
            -sha1 | tr -d ':' | awk -F= '{ print toupper($2) }')"
          if [[ "$signing_identity" =~ ^[0-9A-F]{40}$ ]]; then
            if [[ "${TRUSTED_CERT_CLEANUP_REQUIRED:-0}" == "1" ]]; then
              echo "Removing temporary Estrobo admin trust"
              sudo -n security remove-trusted-cert \
                -d \
                release/signing/estrobo-beta-signing.cer \
                >/dev/null || cleanup_status=1
            fi

            system_certificate=""
            if system_certificate="$(lookup_system_certificate)"; then
              if grep -Fiq "$signing_identity" <<<"$system_certificate"; then
                echo "Deleting temporary Estrobo certificate"
                sudo -n security delete-certificate \
                  -Z "$signing_identity" \
                  /Library/Keychains/System.keychain \
                  >/dev/null || cleanup_status=1
              fi
            else
              lookup_status=$?
              if [[ "$lookup_status" -ne 1 ]]; then
                cleanup_status=1
              fi
            fi

            remaining_certificate=""
            if remaining_certificate="$(lookup_system_certificate)"; then
              if grep -Fiq "$signing_identity" <<<"$remaining_certificate"; then
                echo "The temporary Estrobo certificate remains in the system keychain" >&2
                cleanup_status=1
              fi
            else
              lookup_status=$?
              if [[ "$lookup_status" -ne 1 ]]; then
                cleanup_status=1
              fi
            fi
          else
            echo "Could not derive the Estrobo signing certificate identity" >&2
            cleanup_status=1
          fi

          echo "Removing ephemeral private signing material"
          /bin/rm -f -- \
            "$SIGNING_P12" \
            "$RUNNER_TEMP/imported-signing.pem" \
            "$RUNNER_TEMP/imported-signing.cer" || cleanup_status=1
          if [[ -e "$SIGNING_KEYCHAIN" ]]; then
            echo "Deleting ephemeral signing keychain"
            security delete-keychain "$SIGNING_KEYCHAIN" \
              >/dev/null || cleanup_status=1
          fi
          if [[ "$cleanup_status" -ne 0 ]]; then
            echo "Temporary signing cleanup did not complete safely" >&2
          fi
          exit "$cleanup_status"

      # actions/upload-artifact v7.0.1, pinned to its verified commit.
      - name: Upload signed app for clean-host verification
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: signed-app-${{ needs.validate.outputs.tag }}
          path: ${{ runner.temp }}/estrobo-signed-app.zip
          if-no-files-found: error
          retention-days: 1

  build-draft:
    name: Verify, attest, and create draft
    needs:
      - validate
      - sign
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      TAG: ${{ needs.validate.outputs.tag }}
      VERSION: ${{ needs.validate.outputs.version }}
      BUILD_NUMBER: ${{ needs.validate.outputs.build_number }}
      RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
      RELEASE_TAG_OBJECT: ${{ needs.validate.outputs.tag_object }}
      RELEASE_FILE: ${{ needs.validate.outputs.release_file }}
    steps:
      # actions/checkout v7.0.1, pinned to its verified commit.
      - name: Check out tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false

      # actions/download-artifact v8.0.1, pinned to its verified commit.
      - name: Download signed app
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: signed-app-${{ needs.validate.outputs.tag }}
          path: ${{ runner.temp }}/signed-app

      - name: Extract signed app on the clean verification host
        shell: bash
        run: |
          set -euo pipefail
          destination="prototype/GodoxMacControlPrototype/Build/Universal"
          rm -rf -- "$destination"
          mkdir -p "$destination"
          ditto -x -k \
            "$RUNNER_TEMP/signed-app/estrobo-signed-app.zip" \
            "$destination"

      - name: Verify and package the already-signed app
        run: |
          make mac-prototype-package-existing \
            VERSION="$VERSION" \
            BUILD_NUMBER="$BUILD_NUMBER" \
            TAG="$TAG" \
            COMMIT="$RELEASE_COMMIT"
          (
            cd Dist
            shasum -a 256 -c SHA256SUMS
          )

      # Tag events receive GitHub's standard build-provenance predicate.
      # actions/attest v4.2.2, pinned to its verified commit.
      - name: Generate tag build-provenance attestations
        if: ${{ github.event_name == 'push' }}
        id: attest_tag
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: |
            Dist/*.zip
            Dist/*-manifest.json
            Dist/SHA256SUMS

      - name: Record guarded manual-rebuild provenance
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg releaseTag "$TAG" \
            --arg releaseCommit "$RELEASE_COMMIT" \
            --arg workflowRef "$GITHUB_REF" \
            --arg workflowCommit "$GITHUB_SHA" \
            --arg event "$GITHUB_EVENT_NAME" \
            '{
              schemaVersion: 1,
              releaseSource: {
                tag: $releaseTag,
                commit: $releaseCommit
              },
              workflowSource: {
                ref: $workflowRef,
                commit: $workflowCommit,
                event: $event
              },
              guard: "Protected main supplies the workflow definition; build, signing, verification, packaging, and release-note inputs are checked out from the annotated release commit"
            }' >"$RUNNER_TEMP/manual-rebuild-predicate.json"

      # Manual rebuilds cannot use the dispatch ref as source provenance for
      # the tagged source tree, so the custom predicate records both commits.
      # actions/attest v4.2.2, pinned to its verified commit.
      - name: Generate guarded manual-rebuild attestations
        if: ${{ github.event_name == 'workflow_dispatch' }}
        id: attest_manual
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: |
            Dist/*.zip
            Dist/*-manifest.json
            Dist/SHA256SUMS
          predicate-type: https://github.com/loomitz/estrobo/attestations/manual-tag-rebuild/v1
          predicate-path: ${{ runner.temp }}/manual-rebuild-predicate.json

      - name: Create or refresh draft prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          remote_tag_refs="$(git ls-remote --exit-code \
            "https://github.com/${GITHUB_REPOSITORY}.git" \
            "refs/tags/$TAG" \
            "refs/tags/$TAG^{}")"
          remote_tag_object="$(awk -v ref="refs/tags/$TAG" \
            '$2 == ref { print $1 }' <<<"$remote_tag_refs")"
          remote_commit="$(awk -v ref="refs/tags/$TAG^{}" \
            '$2 == ref { print $1 }' <<<"$remote_tag_refs")"
          if [[ "$remote_tag_object" != "$RELEASE_TAG_OBJECT" || \
            "$remote_commit" != "$RELEASE_COMMIT" ]]; then
            echo "Refusing release mutation because $TAG changed after validation" >&2
            exit 1
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            draft="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq .draft)"
            if [[ "$draft" != "true" ]]; then
              echo "Refusing to overwrite a published release" >&2
              exit 1
            fi
            gh release edit "$TAG" \
              --draft \
              --prerelease \
              --title "estrobo ${TAG#v}" \
              --notes-file "$RELEASE_FILE"
            gh release upload "$TAG" --clobber \
              Dist/*.zip \
              Dist/*-manifest.json \
              Dist/SHA256SUMS
          else
            gh release create "$TAG" \
              --verify-tag \
              --draft \
              --prerelease \
              --title "estrobo ${TAG#v}" \
              --notes-file "$RELEASE_FILE" \
              Dist/*.zip \
              Dist/*-manifest.json \
              Dist/SHA256SUMS
          fi
          echo "Draft retained until public-beta approval and exact smoke marker."

  publish:
    name: Publish approved public beta
    needs:
      - validate
      - build-draft
    runs-on: macos-15
    timeout-minutes: 10
    permissions:
      contents: write
    environment:
      name: public-beta
      url: https://github.com/${{ github.repository }}/releases/tag/${{ needs.validate.outputs.tag }}
    steps:
      - name: Require smoke approval for this exact tag
        shell: bash
        env:
          TAG: ${{ needs.validate.outputs.tag }}
          APPROVED_TAG: ${{ vars.PUBLIC_BETA_SMOKE_APPROVED_TAG }}
        run: |
          set -euo pipefail
          if [[ "$APPROVED_TAG" != "$TAG" ]]; then
            echo "Manual smoke is still pending for $TAG." >&2
            echo "Keep the release draft and set public-beta variable PUBLIC_BETA_SMOKE_APPROVED_TAG=$TAG only after the clean-Mac and hardware gates pass." >&2
            exit 1
          fi

      - name: Publish as prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
          RELEASE_TAG_OBJECT: ${{ needs.validate.outputs.tag_object }}
        run: |
          set -euo pipefail
          remote_tag_refs="$(git ls-remote --exit-code \
            "https://github.com/${GITHUB_REPOSITORY}.git" \
            "refs/tags/$TAG" \
            "refs/tags/$TAG^{}")"
          remote_tag_object="$(awk -v ref="refs/tags/$TAG" \
            '$2 == ref { print $1 }' <<<"$remote_tag_refs")"
          remote_commit="$(awk -v ref="refs/tags/$TAG^{}" \
            '$2 == ref { print $1 }' <<<"$remote_tag_refs")"
          if [[ "$remote_tag_object" != "$RELEASE_TAG_OBJECT" || \
            "$remote_commit" != "$RELEASE_COMMIT" ]]; then
            echo "Refusing publication because $TAG changed after validation" >&2
            exit 1
          fi

          draft="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq .draft)"
          [[ "$draft" == "true" ]]
          gh release edit "$TAG" --draft=false --prerelease
